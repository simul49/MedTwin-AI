name: Build and publish frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    # Don't re-run on our own auto-commits (avoids an infinite loop)
    if: github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Vite root is the repo root (index.html lives there), so dependencies
      # must be resolvable from the root — same as docker/Dockerfile.frontend.
      - name: Link node_modules to repo root
        run: ln -s frontend/node_modules node_modules

      - name: Typecheck
        shell: bash
        run: set -o pipefail && npx vue-tsc --noEmit 2>&1 | tee /tmp/step-typecheck.log
        working-directory: frontend

      - name: Build
        shell: bash
        run: set -o pipefail && npx vite build --base=/site/ 2>&1 | tee /tmp/step-build.log
        working-directory: frontend

      # GitHub Pages publishes the repo root of main. The root index.html is the
      # landing page; the built app goes to /site/ and a root 404.html (copy of
      # the app entry, base=/site/) makes deep links like /site/login work.
      - name: Publish built app into site/
        run: |
          rm -rf site
          mkdir site
          cp -R frontend/dist/. site/
          mv site/dev.html site/index.html
          cp site/index.html 404.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- site 404.html .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: publish built app [auto]"
            git push
          fi
