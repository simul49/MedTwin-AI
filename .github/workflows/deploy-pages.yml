name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        shell: bash
        run: set -o pipefail && npx vue-tsc --noEmit 2>&1 | tee /tmp/step-typecheck.log
        working-directory: frontend

      - name: Build
        shell: bash
        run: set -o pipefail && npx vite build 2>&1 | tee /tmp/step-build.log
        working-directory: frontend

      # SPA fallback: serve index.html for unknown routes (vue-router history mode)
      - name: Add 404 fallback
        if: success()
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/step-*.log
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
