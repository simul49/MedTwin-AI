name: Build and publish frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    # Don't re-run on our own auto-commits (avoids an infinite loop)
    if: github.event.head_commit.author.username != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Vite root is the repo root (index.html lives there), so dependencies
      # must be resolvable from the root — same as docker/Dockerfile.frontend.
      - name: Link node_modules to repo root
        run: ln -s frontend/node_modules node_modules

      - name: Typecheck
        shell: bash
        run: set -o pipefail && npx vue-tsc --noEmit 2>&1 | tee /tmp/step-typecheck.log
        working-directory: frontend

      - name: Build
        shell: bash
        run: set -o pipefail && npx vite build 2>&1 | tee /tmp/step-build.log
        working-directory: frontend

      # GitHub Pages publishes the repo root of main. The built app IS the
      # landing page: dist/index.html (renamed from dev.html) becomes the root
      # index.html, so www.medtwinai.site serves the same Vue app as localhost,
      # rich footer included. A root 404.html (copy of the app entry) makes
      # deep links like /login and /patient work with vue-router history mode.
      - name: Publish built app at the repo root
        run: |
          rm -rf site
          rm -f index.html 404.html
          cp -R frontend/dist/. .
          if [ -f dev.html ]; then mv dev.html index.html; fi
          cp index.html 404.html
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- assets index.html 404.html .nojekyll site dev.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "chore: publish built app [auto]"
            git push
          fi
